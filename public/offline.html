<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a28">
  <title>BYTE BACK | 오프라인</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; display: grid; place-items: center; }
    main { max-width: 560px; padding: 32px 22px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 14px 0; font-size: 30px; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 자료실</div>
    <h1>지금은 인터넷에 연결되어 있지 않습니다</h1>
    <p>자료는 서버에만 있고 이 기기에는 저장하지 않으므로, 오프라인에서는 메모를 볼 수 없습니다. 연결을 확인한 뒤 앱을 다시 열어 주세요.</p>
    <p>기기 승인은 연결된 뒤 서버가 확인하며, 설치 여부는 판단에 쓰지 않습니다.</p>
  </main>
</body>
</html>
